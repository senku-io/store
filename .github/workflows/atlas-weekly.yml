name: Weekly Atlas Rebuild

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with: 
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Generate Atlas
        run: npm run generate:atlas

      - name: Commit if Changed
        run: |
          git config user.name "senkuio-bot"
          git config user.email "64475828+senkuio-bot@users.noreply.github.com"

          git add atlas.json

          git diff --cached --quiet && exit 0
          git commit -m "chore: weekly atlas rebuild"

          git push
