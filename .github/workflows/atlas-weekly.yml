name: Weekly Atlas Rebuild

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Atlas
        run: node scripts/generate-atlas.mjs

      - name: Commit if Changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add atlas.json

          git diff --cached --quiet || git commit -m "chore: weekly atlas rebuild"

          git push
