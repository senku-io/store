name: Weekly Atlas Rebuild

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency: 
  group: weekly-atlas
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with: 
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Generate Atlas
        run: npm run generate:atlas

      - name: Create Update Branch
        run: |
          git config user.name "senkuio-bot"
          git config user.email "64475828+senkuio-bot@users.noreply.github.com"
          BRANCH=update-atlas-$(date +%F)
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          git switch -c $BRANCH

          git add atlas.json

          git diff --cached --quiet && exit 0
          git commit -m "weekly atlas rebuild"

          git push -u origin $BRANCH

      - name: Create Pull Request
        run: |
          gh pr create \
          --title "[CHORE]: Weekly atlas rebuild" \
          --body "Automated atlas refresh." \
          --base develop \
          --reviewer joyalgeorgekj \
          --label chore \
          --assignee joyalgeorgekj
          --head $BRANCH || echo "PR may already exist"
        env:
          GH_TOKEN: ${{ github.token }}
